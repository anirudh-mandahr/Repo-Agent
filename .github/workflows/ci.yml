name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEO4J_AUTH: neo4j/changeme123
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme123
      LIVE_STACK: "1"
      GATEWAY_URL: http://127.0.0.1:8000
      GATEWAY_API_KEY: dev-gateway-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: make lint
      - name: Run offline tests
        run: make test
        env:
          LIVE_STACK: "0"
      - name: Prepare env file
        run: cp .env.example .env
      - name: Start compose stack
        run: docker compose up --build -d
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -H "X-API-Key: $GATEWAY_API_KEY" "$GATEWAY_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Index FastAPI
        run: make index
      - name: Smoke test
        run: make smoke
      - name: Live MCP path tests
        run: uv run pytest -m live tests/test_live_mcp.py
      - name: Stop services
        if: always()
        run: docker compose down -v

  eval:
    runs-on: ubuntu-latest
    needs: test
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme123
      NEO4J_AUTH: neo4j/changeme123
      REPO_ROOT: ${{ runner.temp }}/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare env file
        run: cp .env.example .env
      - name: Clone FastAPI source
        run: git clone --depth=1 https://github.com/fastapi/fastapi "$REPO_ROOT"
      - name: Start Neo4j and indexer
        run: docker compose up --build -d neo4j indexer
      - name: Index FastAPI
        run: make index
      - name: Run evals
        run: |
          set -o pipefail
          make eval | tee eval-scorecard.txt
          {
            echo "## Eval scorecard"
            echo
            echo '```'
            cat eval-scorecard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop services
        if: always()
        run: docker compose down -v
