[project]
name = "core"
version = "0.1.0"
description = "Framework-free business logic: AST parsing, graph ops, routing, LLM provider."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "neo4j>=5.26",
    "openai>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
