[project]
name = "core"
version = "0.1.0"
description = "Framework-free business logic: AST parsing, graph ops, routing, LLM provider."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "mcp>=1.28.1,<2",
    "neo4j>=5.26",
    "openai>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
