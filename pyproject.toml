[project]
name = "fastapi-repo-chat"
version = "0.1.0"
description = "FastAPI repository chat agent: five MCP servers over a Neo4j knowledge graph, fronted by a FastAPI gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "agents/*", "gateway"]

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "core/tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires a running Neo4j instance (set NEO4J_URI)",
    "live: requires running the full Docker Compose stack (containers + env)",
]

[tool.coverage.run]
source = [
    "core",
    "orchestrator",
    "indexer",
    "graph_query",
    "code_analyst",
    "memory",
    "gateway",
]
branch = true
omit = ["*/tests/*", "core/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["core/tests/fixtures"]
src = [
    "core/src",
    "agents/orchestrator/src",
    "agents/indexer/src",
    "agents/graph_query/src",
    "agents/code_analyst/src",
    "agents/memory/src",
    "gateway/src",
    "tests",
    "core/tests",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"agents/**" = ["D"]
"gateway/**" = ["D"]
"tests/**" = ["D"]
"core/tests/**" = ["D"]
"scripts/**" = ["D"]
"core/tests/fixtures/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "core/src",
    "agents/orchestrator/src",
    "agents/indexer/src",
    "agents/graph_query/src",
    "agents/code_analyst/src",
    "agents/memory/src",
    "gateway/src",
]
explicit_package_bases = true
packages = [
    "core",
    "orchestrator",
    "indexer",
    "graph_query",
    "code_analyst",
    "memory",
    "gateway",
]
